name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (Mock mode, exclude RAG)
        env:
          LLM_MOCK_MODE: "true"
        run: |
          python -m pytest tests/unit/test_agent.py tests/unit/test_scheduler.py \
            tests/unit/test_database.py tests/unit/test_vision.py tests/unit/test_redteam.py \
            -v --tb=short

      - name: Run full test suite with coverage
        env:
          LLM_MOCK_MODE: "true"
        run: |
          pip install pytest-cov
          python -m pytest --cov=lifeops --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
